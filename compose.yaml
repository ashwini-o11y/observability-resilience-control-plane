services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: orion-baseline-kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/create-kafka-topic.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
      KAFKA_TOPIC: orion.baseline.telemetry.logs.v1
      KAFKA_TOPIC_PARTITIONS: 3
      KAFKA_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - ./scripts:/scripts:ro

  otel-collector:
    image: orion-baseline-collector:0.111.0
    build:
      context: .
      dockerfile: docker/collector/Dockerfile
    container_name: orion-baseline-collector
    environment:
      ENABLE_DYNATRACE: ${ENABLE_DYNATRACE:-false}
      DYNATRACE_OTLP_ENDPOINT: ${DYNATRACE_OTLP_ENDPOINT:-}
      DYNATRACE_API_TOKEN: ${DYNATRACE_API_TOKEN:-}
      ENABLE_SPLUNK: ${ENABLE_SPLUNK:-false}
      SPLUNK_HEC_ENDPOINT: ${SPLUNK_HEC_ENDPOINT:-}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-}
      SPLUNK_HEC_INDEX: ${SPLUNK_HEC_INDEX:-main}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-qO-", "http://localhost:13133"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - ./collector/collector.generated.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./artifacts/collector:/var/lib/otelcol
    ports:
      - "13133:13133"
      - "8888:8888"

  workload:
    build:
      context: .
      dockerfile: docker/workload/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "9102:9102"
    profiles: ["generator"]

volumes:
  kafka-data:
