[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-baseline-lab"
version = "0.1.0"
description = "Baseline lab workload and configuration helpers for ORION experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "confluent-kafka==2.15.1",
  "opentelemetry-proto==1.37.0",
  "prometheus-client==0.22.1",
]

[project.optional-dependencies]
dev = [
  "PyYAML==6.0.2",
  "pytest==8.4.2",
]

[tool.setuptools.packages.find]
include = ["baseline_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
